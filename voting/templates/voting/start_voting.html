{% load static %}
<!DOCTYPE html>
<html lang="en">
<head link rel="stylesheet" href="{% static 'css/style.css' %}">
  <meta charset="UTF-8">
  <title>{% block title %}Start Voting{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

  <div class="form-container">
    <h2>Select Your Team</h2>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="button button-blue" type="submit">Start</button>
    </form>
  </div>

</body>
</html>
