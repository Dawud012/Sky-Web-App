{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Sky App{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <!-- Shared Navbar -->
  <nav class="navbar">
    <div class="navbar-content container">
      <img src="{% static 'images/skyLogo.webp' %}" alt="Logo" class="navbar-logo">
      <div class="navbar-links">
        <a href="{% url 'home' %}" class="{% if request.path == '/' %}active{% endif %}">Home</a>
        <a href="{% url 'start_voting' %}" class="{% if request.path == '/voting/start/' %}active{% endif %}">Voting</a>
        <a href="{% url 'trends' %}" class="{% if request.path == '/trends/' %}active{% endif %}">Trends</a>

        {% if user.is_authenticated %}
          <a href="{% url 'profile' %}" class="{% if request.path == '/accounts/profile/' %}active{% endif %}">Profile</a>
          <a href="{% url 'logout' %}" class="logout-button">Logout</a>
        {% else %}
          <a href="{% url 'login' %}" class="{% if request.path == '/accounts/login/' %}active{% endif %}">Login</a>
          <a href="{% url 'staff-register' %}" class="{% if request.path == '/accounts/register/' %}active{% endif %}">Register</a>

        {% endif %}
      </div>
    </div>
  </nav>

  <div class="pink-divider"></div>

  <!-- Main Page Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

</body>
</html>
