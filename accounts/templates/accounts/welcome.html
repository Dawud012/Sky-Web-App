{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome - Sky Health Check</title>
  
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

  <style>
    /* Reset default margins and set font */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
    }

    /* Header bar with pink underline */
    .header-bar {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 6px solid #e4416d; /* Sky pink */
      background-color: white;
    }

    /* Sky logo styling */
    .sky-logo {
      height: 60px;
    }

    /* Centered content area */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 86px); /* Adjust based on header height */
    }

    /* Sign-in button styling */
    .welcome-button {
      background-color: #e4416d;
      border: none;
      color: white;
      padding: 15px 40px;
      margin: 15px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
      text-decoration: none;
      text-align: center;
    }

    .welcome-button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- Header with Sky logo -->
  <div class="header-bar">
    <img src="{% static 'images/skyLogo.webp' %}" alt="Sky Logo" class="sky-logo">
  </div>
  
  <div class="pink-divider"></div>
  

  <!-- Main content with sign-in buttons -->
  <div class="content">
    <a href="/admin/" class="welcome-button">Admin Sign in</a>
    <a href="{% url 'staff-register' %}" class="welcome-button">Staff Sign in</a>

  </div>

</body>
</html>
