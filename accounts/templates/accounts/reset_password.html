{% load static %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <!-- Navigation and Divider -->
  <div class="navbar">
    <div class="navbar-content container">
      <img src="{% static 'images/skyLogo.webp' %}" alt="Sky Logo" class="navbar-logo">
      <div class="navbar-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'start_voting' %}">Voting</a>
        <a href="{% url 'trends' %}">Trends</a>
        <a href="{% url 'profile' %}">Profile</a>
        <a href="{% url 'logout' %}">Logout</a>
      </div>
    </div>
  </div>
  <div class="pink-divider"></div>

  <!-- Main Form -->
  <div class="container">
    <h2>Forgot Password</h2>
    <p style="color: #e4416d;">Enter your email:</p>

    <form method="POST" style="display: flex; flex-direction: column; align-items: center;">
        {% csrf_token %}
        <input type="email" name="email" class="input-field" placeholder="Email Address" required>
      
        {% if email_sent %}
          <p class="success">Email sent</p>
          <button class="button" type="submit">Resend Email</button>
          <p class="note">Check your spam and junk folders</p>
          <p class="small-note">Please allow up to 60 seconds for the email link</p>
        {% else %}
          <button class="button" type="submit">Confirm</button>
        {% endif %}
      </form>
  </div>

</body>
</html>
