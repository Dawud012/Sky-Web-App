{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', sans-serif;
      background-color: white;
      color: #000;
    }
  
    .header-bar {
      display: flex;
      align-items: center;
      padding: 10px 20px;
    }
  
    .sky-logo {
      height: 60px;
    }
  
    .pink-divider {
      height: 40px; /* ✅ Match login page thickness */
      background-color: #e4416d;
      margin-bottom: 30px;
    }
  
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  
    h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
  
    p {
      font-size: 1rem;
    }
  
    .input-field {
      width: 300px;
      padding: 12px;
      border-radius: 30px;
      border: 2px solid #000aff;
      font-size: 1rem;
      margin: 10px 0;
      text-align: center;
    }
  
    .button {
      padding: 10px 30px;
      background-color: #000aff;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      margin-top: 15px;
      cursor: pointer;
    }
  
    .success {
      color: #000aff;
      font-weight: bold;
      margin-top: 10px;
    }
  
    .note {
      color: #e4416d;
      margin-top: 20px;
    }
  
    .small-note {
      color: #000aff;
      margin-top: 10px;
    }
  </style>
  
</head>
<body>

  <!-- Header -->
  <div class="header-bar">
    <img src="{% static 'images/skyLogo.webp' %}" alt="Sky Logo" class="sky-logo">
  </div>
  <div class="pink-divider"></div>

  <!-- Main Form -->
  <div class="container">
    <h2>Forgot Password</h2>
    <p style="color: #e4416d;">Enter your email:</p>

    <form method="POST" style="display: flex; flex-direction: column; align-items: center;">
        {% csrf_token %}
        <input type="email" name="email" class="input-field" placeholder="Email Address" required>
      
        {% if email_sent %}
          <p class="success">Email sent</p>
          <button class="button" type="submit">Resend Email</button>
          <p class="note">Check your spam and junk folders</p>
          <p class="small-note">Please allow up to 60 seconds for the email link</p>
        {% else %}
          <button class="button" type="submit">Confirm</button>
        {% endif %}
      </form>
      
  </div>

</body>
</html>
